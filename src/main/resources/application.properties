# Server Configuration
server.port=8080

# Database Configuration (SQLite - file in project directory)
database.url=jdbc:sqlite:data/krankenhausverwaltung.db
database.driver=org.sqlite.JDBC

# Disable Spring Boot AutoConfigurations (using ORMLite instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.at.htl.infi3ahwii.verwaltung_krankenhaus=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
